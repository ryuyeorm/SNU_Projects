experiment:
  name: smoke
  seeds: [0]
  deterministic_torch: true
environment:
  goal: [1.0, 0.0]
  step_scale: 0.1
  episode_horizon: 30
  success_radius: 0.1
  transition_noise_std: 0.0
  start_position_std: 0.05
  state_bound: 2.0
agent:
  gamma: 0.99
  gae_lambda: 0.95
  actor_lr: 0.0003
  critic_lr: 0.001
  hidden_sizes: [32, 32]
  max_grad_norm: 1.0
training:
  rollout_steps: 32
  source_steps: 64
  probe_steps: 32
  target_steps: 64
  eval_interval: 32
  eval_episodes: 2
  zero_shot_eval_episodes: 2
  num_alignment_batches: 2
  alignment_batch_steps: 32
  transfer_lambda: 0.1
  probe_budgets: [16, 32]
paths:
  checkpoints: checkpoints_smoke
  results: results_smoke
  plots: plots_smoke
