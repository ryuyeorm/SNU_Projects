[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gradient-transfer-test"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "gymnasium>=0.29", "numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7", "scipy>=1.10", "PyYAML>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
